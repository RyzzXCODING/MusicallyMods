plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"musicallymods" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Pure-Java Java Sound SPI decoders for MP3 and OGG Vorbis streams.
	// Bundled with the mod so no external native player is required.
	def audioLibs = [
			"dev.mccue:mp3spi:${project.audio_decoder_version}",
			"dev.mccue:jlayer-decoder:${project.audio_decoder_version}",
			"dev.mccue:tritonus-share:${project.audio_decoder_version}",
			"dev.mccue:vorbisspi:${project.audio_decoder_version}",
			"dev.mccue:jogg:${project.audio_decoder_version}",
			"dev.mccue:jorbis:${project.audio_decoder_version}"
	]
	audioLibs.each { dep ->
		implementation dep
		include dep
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
